<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>天气查询</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main class="container">
    <div class="header-bar">
      <h1>🌤️ 天气查询</h1>
      <button id="unitToggle" type="button" title="切换温度/风速单位">°C · km/h</button>
    </div>
    <div class="search-bar">
      <input id="cityInput" type="text" placeholder="输入城市名，如 Beijing / 北京" autocomplete="off">
      <button id="queryBtn" type="button">查询</button>
      <button id="locateBtn" type="button" title="使用浏览器定位查询当前位置天气">📍</button>
    </div>
    <div id="favorites" class="favorites hidden"></div>
    <p id="errorBox" class="error hidden"></p>
    <section id="currentCard" class="current-card hidden"></section>
    <section id="dailyList" class="daily-list hidden"></section>
  </main>
  <script src="app.js"></script>
</body>
</html>
